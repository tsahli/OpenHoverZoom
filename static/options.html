<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenHoverZoom options</title>
    <link rel="stylesheet" href="settings.css" />
  </head>
  <body class="options">
    <main>
      <h1>OpenHoverZoom options</h1>
      <form id="settings-form">
        <label>
          Hover delay (milliseconds)
          <input id="hover-delay" type="number" min="100" max="1500" step="25" />
        </label>
        <label>
          Maximum preview size (% of viewport)
          <input id="preview-size" type="number" min="25" max="95" step="5" />
        </label>
        <label>
          Hover media volume (%)
          <input
            id="media-volume"
            type="number"
            min="0"
            max="100"
            step="5"
            aria-describedby="media-volume-help"
          />
          <small id="media-volume-help">
            Applies to video and audio previews. Use 0 to keep previews muted.
          </small>
        </label>
        <label class="row">
          <span>Preview same-size images</span>
          <input id="same-size" type="checkbox" />
        </label>
        <label class="row">
          <span>Preview plain links</span>
          <input id="text-links" type="checkbox" aria-describedby="text-links-help" />
        </label>
        <small id="text-links-help">
          Off by default. When on, hovering a link that has no image looks up the linked
          page and previews its main image or video if it has one. The page is requested
          without cookies, so every link you rest the pointer on contacts that site.
        </small>
        <label>
          Temporarily disable previews shortcut
          <span class="shortcut-control">
            <input
              id="preview-disable-shortcut"
              type="text"
              readonly
              aria-describedby="preview-disable-shortcut-help"
            />
            <button id="reset-preview-disable-shortcut" type="button">Use Ctrl</button>
          </span>
          <small id="preview-disable-shortcut-help">
            Click the field and press a key or key combination. Hold it to hide and disable
            previews.
          </small>
        </label>
        <label>
          Download shortcut
          <span class="shortcut-control">
            <input
              id="download-shortcut"
              type="text"
              readonly
              aria-describedby="download-shortcut-help"
            />
            <button id="reset-download-shortcut" type="button">Use Enter</button>
          </span>
          <small id="download-shortcut-help">
            Click the field, then press Enter, Space, a letter, or a number.
            Modifier keys are optional.
          </small>
        </label>
        <button type="submit">Save</button>
      </form>
      <section>
        <h2>Disabled sites</h2>
        <p id="empty-sites">No sites are disabled.</p>
        <ul id="disabled-sites"></ul>
      </section>
      <p id="status" role="status"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
